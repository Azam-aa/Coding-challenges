<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instagram Heart Like</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:black;
  color:white;
  font-family:sans-serif;
  flex-direction:column;
}
#imgContainer{
  position:relative;
  width:400px;
  height:400px;
}
#mainImg{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:12px;
  cursor:pointer;
}
.heart{
  position:absolute;
  width:100px;
  height:100px;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  opacity:0;
  pointer-events:none;
  transition:transform 0.3s ease, opacity 0.3s ease;
}
.heart.show{
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
}
#likeCount{
  margin-top:20px;
  font-size:20px;
}
</style>
</head>
<body>

<div id="imgContainer">
  <img src="pic.jpg" id="mainImg">
  <img src="heart.png" class="heart" id="heart">
</div>
<div id="likeCount">Likes: 0</div>

<script>
let likes=0;
const img=document.getElementById('mainImg');
const heart=document.getElementById('heart');
const count=document.getElementById('likeCount');

img.addEventListener('dblclick',()=>{
  likes++;
  heart.classList.add('show');
  count.textContent='Likes: '+likes;
  setTimeout(()=>heart.classList.remove('show'),500);
});
</script>

</body>
</html>
